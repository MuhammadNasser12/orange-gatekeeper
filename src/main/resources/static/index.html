<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Egypt | Deployment Gatekeeper</title>
    <style>
        :root {
            --orange: #FF7900;
            --orange-hover: #E56D00;
            --bg-dark: #0D0D0D;
            --surface: #161616;
            --surface-alt: #1F1F1F;
            --border: #2D2D2D;
            --text-main: #F5F5F5;
            --text-muted: #9E9E9E;
            --status-submitted: #FF7900;
            --status-deployed: #2EA043;
            --status-rollback: #F85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        header {
            background-color: #000000;
            border-bottom: 2px solid var(--orange);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .orange-logo {
            width: 38px;
            height: 38px;
            background-color: var(--orange);
            display: flex;
            align-items: flex-end;
            padding: 4px;
            font-weight: 700;
            font-size: 9px;
            color: #FFFFFF;
            letter-spacing: 0.3px;
        }
        .brand-title h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .brand-title span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 9px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            border-radius: 3px;
        }
        .tab-btn.active {
            background: var(--orange);
            color: #000000;
            border-color: var(--orange);
        }
        main {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 24px;
        }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        input, select, textarea {
            width: 100%;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 3px;
            font-size: 13px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--orange);
        }
        .btn {
            background: var(--orange);
            color: #000000;
            border: none;
            padding: 9px 16px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .btn:hover { background: var(--orange-hover); }
        .btn-secondary {
            background: var(--surface-alt);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--orange); background: #262626; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        th {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            background: #121212;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 2px;
            text-transform: uppercase;
        }
        .badge-Submitted { background: rgba(255, 121, 0, 0.18); color: var(--status-submitted); border: 1px solid var(--status-submitted); }
        .badge-Deployed { background: rgba(46, 160, 67, 0.18); color: var(--status-deployed); border: 1px solid var(--status-deployed); }
        .badge-Rolled { background: rgba(248, 81, 73, 0.18); color: var(--status-rollback); border: 1px solid var(--status-rollback); }
        .mono { font-family: Consolas, Monaco, monospace; font-size: 12px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .full-width { grid-column: 1 / -1; }
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--orange);
            width: 90%;
            max-width: 760px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 4px;
        }
        pre {
            background: #090909;
            border: 1px solid var(--border);
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            margin-top: 6px;
            color: #D4D4D4;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="orange-logo">orange</div>
        <div class="brand-title">
            <h1>DEPLOYMENT GATEKEEPER</h1>
            <span>Orange Egypt Middleware &amp; Integration Staging Portal</span>
        </div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('opsView', this)">OPS VIEW (CONTROL CENTER)</button>
        <button class="tab-btn" onclick="switchView('devView', this)">DEV VIEW (SUBMIT HANDOVER)</button>
    </div>
</header>

<main>
    <!-- OPS VIEW -->
    <section id="opsView" class="view-panel active">
        <div class="card">
            <div class="filter-grid">
                <div>
                    <label>Search (Ticket / Service / Developer / SHA-256)</label>
                    <input type="text" id="searchFilter" placeholder="Filter records..." oninput="renderOpsTable()">
                </div>
                <div>
                    <label>Domain (./domains.txt)</label>
                    <select id="opsDomainFilter" onchange="renderOpsTable()">
                        <option value="All">All</option>
                    </select>
                </div>
                <div>
                    <label>Component Type</label>
                    <select id="opsComponentFilter" onchange="renderOpsTable()">
                        <option value="All">All</option>
                        <option value="webMethods IS Package">webMethods IS Package</option>
                        <option value="Configurations">Configurations</option>
                    </select>
                </div>
                <div>
                    <label>Status</label>
                    <select id="opsStatusFilter" onchange="renderOpsTable()">
                        <option value="All">All</option>
                        <option value="Submitted">Submitted</option>
                        <option value="Deployed">Deployed</option>
                        <option value="Rolled Back">Rolled Back</option>
                    </select>
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="loadData()">REFRESH</button>
                </div>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID / Timestamp</th>
                        <th>Ticket ID</th>
                        <th>Domain</th>
                        <th>Service / Package</th>
                        <th>Component Type</th>
                        <th>Developer</th>
                        <th>Artifact &amp; SHA-256</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="opsTableBody"></tbody>
            </table>
        </div>
    </section>

    <!-- DEV VIEW -->
    <section id="devView" class="view-panel">
        <div class="card">
            <h2 style="margin-bottom: 16px; font-size: 16px; color: var(--orange);">SUBMIT NEW DEPLOYMENT PACKAGE</h2>
            <form id="devForm" onsubmit="submitDeployment(event)">
                <div class="form-grid">
                    <div>
                        <label>Developer Name / CUID *</label>
                        <input type="text" id="devName" required placeholder="e.g. a.hassan">
                    </div>
                    <div>
                        <label>Ticket / Change Request ID *</label>
                        <input type="text" id="ticketId" required placeholder="e.g. CR-90412">
                    </div>
                    <div>
                        <label>Domain (Read from ./domains.txt) *</label>
                        <select id="devDomain" required></select>
                    </div>
                    <div>
                        <label>Service / Package Name *</label>
                        <input type="text" id="serviceName" required placeholder="e.g. OEG_PaymentIntegration_IS">
                    </div>
                    <div>
                        <label>Package Type *</label>
                        <select id="packageType" required>
                            <option value="Code">Code</option>
                            <option value="Configurations">Configurations</option>
                        </select>
                    </div>
                    <div>
                        <label>Upload Artifact (.zip, .ispackage, .jar, .cfg, .xml) *</label>
                        <input type="file" id="artifactFile" required>
                    </div>
                    <div class="full-width">
                        <label>Deployment Instructions &amp; Pre-requisites *</label>
                        <textarea id="instructions" rows="4" required placeholder="Specify exact installation order, IS package activation, or configuration properties..."></textarea>
                    </div>
                    <div class="full-width">
                        <label>Rollback Plan *</label>
                        <textarea id="rollbackPlan" rows="3" required placeholder="Specify exact rollback snapshot or backup package recovery procedure..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn" id="submitBtn">STAGE ARTIFACT TO CENTRAL DIRECTORY</button>
            </form>
        </div>
    </section>
</main>

<!-- INSPECT MODAL -->
<div class="modal-backdrop" id="inspectModal">
    <div class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 id="modalTitle" style="color:var(--orange);">Deployment Details</h3>
            <button class="btn btn-secondary" onclick="closeModal()">CLOSE</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    let allDeployments = [];
    let domainsList = [];

    async function loadData() {
        const [domRes, depRes] = await Promise.all([
            fetch('/api/domains'),
            fetch('/api/deployments')
        ]);
        domainsList = await domRes.json();
        allDeployments = await depRes.json();
        populateDomains();
        renderOpsTable();
    }

    function populateDomains() {
        const opsSelect = document.getElementById('opsDomainFilter');
        const devSelect = document.getElementById('devDomain');
        const currentOpsVal = opsSelect.value || 'All';

        opsSelect.innerHTML = '<option value="All">All</option>' +
            domainsList.map(d => `<option value="${d}">${d}</option>`).join('');
        opsSelect.value = currentOpsVal;

        devSelect.innerHTML = domainsList.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    function renderOpsTable() {
        const q = document.getElementById('searchFilter').value.toLowerCase();
        const dom = document.getElementById('opsDomainFilter').value;
        const comp = document.getElementById('opsComponentFilter').value;
        const st = document.getElementById('opsStatusFilter').value;

        const filtered = allDeployments.filter(d => {
            const matchQ = !q || [d.ticketId, d.serviceName, d.developer, d.sha256, d.id]
                .some(v => (v || '').toLowerCase().includes(q));
            const matchDom = dom === 'All' || d.domain === dom;
            const matchComp = comp === 'All' || d.componentType === comp;
            const matchSt = st === 'All' || d.status === st;
            return matchQ && matchDom && matchComp && matchSt;
        });

        const tbody = document.getElementById('opsTableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:var(--text-muted); padding:28px;">No deployments submitted from Dev View matching criteria.</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(d => {
            const badgeClass = 'badge-' + d.status.split(' ')[0];
            return `<tr>
                <td><strong class="mono">${d.id}</strong><br><span style="font-size:11px;color:var(--text-muted)">${d.timestamp}</span></td>
                <td class="mono">${d.ticketId}</td>
                <td><strong>${d.domain}</strong></td>
                <td>${d.serviceName}</td>
                <td>${d.componentType}</td>
                <td>${d.developer}</td>
                <td class="mono">${d.fileName}<br><span style="font-size:11px;color:var(--text-muted)">SHA256: ${d.sha256.substring(0, 12)}...</span></td>
                <td><span class="badge ${badgeClass}">${d.status}</span></td>
                <td>
                    <button class="btn btn-secondary" onclick="inspectRecord('${d.id}')">INSPECT</button>
                    <button class="btn" onclick="distributeRecord('${d.id}')">DISTRIBUTE</button>
                </td>
            </tr>`;
        }).join('');
    }

    async function submitDeployment(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'UPLOADING & HASHING...';

        const fd = new FormData();
        fd.append('developer', document.getElementById('devName').value);
        fd.append('ticketId', document.getElementById('ticketId').value);
        fd.append('domain', document.getElementById('devDomain').value);
        fd.append('serviceName', document.getElementById('serviceName').value);
        fd.append('packageType', document.getElementById('packageType').value);
        fd.append('instructions', document.getElementById('instructions').value);
        fd.append('rollbackPlan', document.getElementById('rollbackPlan').value);
        fd.append('artifact', document.getElementById('artifactFile').files[0]);

        const res = await fetch('/api/deployments', { method: 'POST', body: fd });
        btn.disabled = false;
        btn.textContent = 'STAGE ARTIFACT TO CENTRAL DIRECTORY';

        if (res.ok) {
            document.getElementById('devForm').reset();
            await loadData();
            switchView('opsView', document.querySelectorAll('.tab-btn')[0]);
        } else {
            alert('Upload failed.');
        }
    }

    function inspectRecord(id) {
        const d = allDeployments.find(x => x.id === id);
        if (!d) return;
        document.getElementById('modalTitle').textContent = `${d.id} | ${d.ticketId} — ${d.serviceName}`;
        document.getElementById('modalBody').innerHTML = `
            <p><strong>Domain:</strong> ${d.domain} | <strong>Component Type:</strong> ${d.componentType} (Dev Input: ${d.packageType})</p>
            <p style="margin-top:6px;"><strong>Central Staging Path:</strong> <span class="mono">${d.stagingPath}</span></p>
            <p style="margin-top:6px;"><strong>Full SHA-256 Checksum:</strong> <span class="mono">${d.sha256}</span></p>
            <div style="margin-top:14px;">
                <label>Deployment Instructions &amp; Pre-requisites</label>
                <pre>${d.instructions}</pre>
            </div>
            <div style="margin-top:14px;">
                <label>Rollback Plan</label>
                <pre>${d.rollbackPlan}</pre>
            </div>
            <div style="margin-top:14px;">
                <label>Distribution Audit Log</label>
                <pre>${d.distributionLog}</pre>
            </div>
            <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
                <label style="margin:0;">Update Status:</label>
                <button class="btn btn-secondary" onclick="changeStatus('${d.id}', 'Submitted')">SUBMITTED</button>
                <button class="btn" onclick="changeStatus('${d.id}', 'Deployed')">DEPLOYED</button>
                <button class="btn btn-secondary" onclick="changeStatus('${d.id}', 'Rolled Back')">ROLLED BACK</button>
            </div>
        `;
        document.getElementById('inspectModal').classList.add('open');
    }

    async function changeStatus(id, status) {
        await fetch(`/api/deployments/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        await loadData();
        inspectRecord(id);
    }

    async function distributeRecord(id) {
        const res = await fetch(`/api/deployments/${id}/distribute`, { method: 'POST' });
        if (res.ok) {
            await loadData();
            inspectRecord(id);
        }
    }

    function closeModal() {
        document.getElementById('inspectModal').classList.remove('open');
    }

    function switchView(viewId, btn) {
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
